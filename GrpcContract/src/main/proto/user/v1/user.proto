syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.grpc.user.v1";

service UserService {
  rpc getUser(GetUserRequest) returns (UserResponse);
}

message GetUserRequest {
  int64 userId = 1;
}

message UserResponse {
  int64 userId = 1;
  string email = 2;
  string fullName = 3;
}
