spring.application.name=AuthService
server.port=8081

eureka.client.service-url.defaultZone=http://${DISCOVERY_SERVER:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

spring.datasource.url=jdbc:postgresql://${DB_HOST_POSTGRES:localhost}:5432/auth_db?reWriteBatchedInserts=true
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.password=${REDIS_PASS}
spring.data.redis.port=6379

spring.flyway.enabled=true
spring.flyway.baseline-version=1
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.cloud.openfeign.circuitbreaker.enabled=true

spring.mvc.servlet.load-on-startup=1
spring.cloud.loadbalancer.eager-load.clients=UserService
spring.datasource.hikari.minimum-idle=2

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=alpha

spring.grpc.client.channel.user-service.target=static://localhost:9090
spring.grpc.client.channel.user-service.bypass-certificate-validation=true