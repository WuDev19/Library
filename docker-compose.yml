include:
  - ./kafka/docker-compose.yml

services:
  postgres-db:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASS}
      - --appendonly
      - "yes"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - redis-data:/data

  discovery-server:
    build:
      context: ./DiscoveryServer
      dockerfile: Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

#  config-server:
#    build:
#      context: ./ConfigServer
#      dockerfile: Dockerfile
#    container_name: config-server
#    ports:
#      - "8888:8888"
#    environment:
#      PAT_GIT: ${PAT_GIT}
#      DISCOVERY_SERVER: discovery-server
#      RSA_PASS: ${RSA_PASS}
#    depends_on:
#      discovery-server:
#        condition: service_healthy
#    healthcheck:
#      test: [ "CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1" ]
#      interval: 10s
#      timeout: 5s
#      retries: 12
#      start_period: 25s

  api-gateway-service:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER: config-server
      DISCOVERY_SERVER: discovery-server
      REDIS_HOST: redis
      REDIS_PASS: ${REDIS_PASS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      discovery-server:
        condition: service_healthy
#      config-server:
#        condition: service_healthy
      redis:
        condition: service_healthy

  auth-service:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER: config-server
      DISCOVERY_SERVER: discovery-server
      REDIS_HOST: redis
      REDIS_PASS: ${REDIS_PASS}
      DB_HOST_POSTGRES: postgres-db
      DB_USERNAME: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      discovery-server:
        condition: service_healthy
#      config-server:
#        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy

  user-service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER: config-server
      DISCOVERY_SERVER: discovery-server
      DB_HOST_POSTGRES: postgres-db
      DB_PASSWORD: ${USER_DB_PASSWORD}
      DB_USERNAME: user_user
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REDIS_HOST: redis
      REDIS_PASS: ${REDIS_PASS}
    depends_on:
      discovery-server:
        condition: service_healthy
#      config-server:
#        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy

  book-borrow-service:
    build:
      context: ./BookBorrowService
      dockerfile: Dockerfile
    container_name: book-borrow-service
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER: config-server
      DISCOVERY_SERVER: discovery-server
      DB_HOST_POSTGRES: postgres-db
      DB_PASSWORD: ${BOOK_DB_PASSWORD}
      DB_USERNAME: book_user
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REDIS_HOST: redis
      REDIS_PASS: ${REDIS_PASS}
    depends_on:
      discovery-server:
        condition: service_healthy
#      config-server:
#        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy

  notification-service:
    build:
      context: ./NotificationService
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    container_name: notification-service
    environment:
      CONFIG_SERVER: config-server
      DISCOVERY_SERVER: discovery-server
      DB_HOST_POSTGRES: postgres-db
      DB_PASSWORD: ${NOTIFICATION_PASSWORD}
      DB_USERNAME: notification_user
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REDIS_HOST: redis
      REDIS_PASS: ${REDIS_PASS}
      APP_EMAIL: ${APP_EMAIL}
      APP_EMAIL_PASSWORD: ${APP_EMAIL_PASSWORD}
    depends_on:
      discovery-server:
        condition: service_healthy
      #      config-server:
      #        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy

volumes:
  postgres_data:
  redis-data: