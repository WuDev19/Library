spring.application.name=ConfigServer
server.port=8888
spring.cloud.config.server.git.uri=https://github.com/WuDev19/LibraryConfig
spring.cloud.config.server.git.username=WuDev19
spring.cloud.config.server.git.password=${PAT_GIT}
encrypt.key-store.location=classpath:config-server.jks
encrypt.key-store.alias=config-key
encrypt.key-store.password=${RSA_PASS}
management.endpoints.web.exposure.include=health,info
eureka.client.service-url.defaultZone=http://${DISCOVERY_SERVER:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
